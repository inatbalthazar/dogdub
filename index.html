<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="เว็บเกมพากษ์เสียงออนไลน์ เล่นกับเพื่อนแบบแบ่งคิวพากษ์ มี Scene Pack ให้เลือก หลากหลายฉาก สร้างห้องหรือเข้าร่วมห้องเล่นเกมได้ทันที" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script>
      // Clear legacy Service Workers & CacheStorage holding old bundles (e.g. index-BU84DDN8.js)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) caches.delete(names[i]);
        });
      }
      // Suppress benign ogv.js WASM demuxer cancellation warnings when seeking/switching clips
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.name === 'AbortError' || String(e.reason).includes('Aborted') || String(e.reason).includes('receiveInput'))) {
          e.preventDefault();
        }
      });
    </script>
    
    <!-- Google Fonts Imports: Kanit (Thai/UI), Outfit, Barlow Condensed, Bowlby One SC, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Bowlby+One+SC&family=JetBrains+Mono:wght@600;800&family=Kanit:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="/vendor/ogv/ogv.js"></script>
    <script src="/voice-effects.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
